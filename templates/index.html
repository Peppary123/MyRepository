<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il tuo Linktree</title>
    <style>
        /* Stile generale */
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
        }

        /* Contenitore principale */
        .container {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* Stile per i link */
        .link-list {
            list-style: none;
            padding: 0;
        }

        .link-list li {
            margin: 10px 0;
        }

        .link-card {
            display: block;
            padding: 12px;
            background: #007bff;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.3s;
        }

        .link-card:hover {
            background: #0056b3;
        }

        /* Messaggio se non ci sono link */
        .no-links {
            color: red;
            font-weight: bold;
        }
    </style>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <h1>🌐 Il tuo Linktree</h1>
        
        {% if links %}
            <ul class="link-list">
                {% for link in links %}
                <li><a class="link-card" href="{{ link.url }}" target="_blank">{{ link.name }}</a></li>
                {% endfor %}
            </ul>
        {% else %}
            <p class="no-links">❌ Nessun link disponibile!</p>
        {% endif %}
    </div>

</body>
</html>
